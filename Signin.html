<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign In - SXC Club Workspace</title>
</head>
<body>
    <header>
    </header>

    <div class="wrapper">
        <form method="Post">

            <h1>Sign in</h1>

            <div class="textbox">
                <input type="text" name="username" required placeholder="Username" maxlength="15" minlength="8">
            </div>

            <div class="textbox">
                <input type="password" name="password" required placeholder="Password" maxlength="15" minlength="8">
            </div>

            <div class="rem_forg">       
                <label><input type="checkbox" name="rem_me?"> Remember me?</label>
                <a href="#">Forgot password?</a>
            </div>

            <div class="button">
                <button type="submit">Sign in</button>
            </div>
            
            <div class="register_link">
                <p>Don't have an account yet? <a href="register.html">Register now</a></p>
            </div>

        </form>
    </div>
    
</body>
</html>
